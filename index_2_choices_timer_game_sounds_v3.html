<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Race — Departures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --teal-deep:#123832;
    --teal-panel:#17453d;
    --cream:#F2E9D6;
    --cream-dim:#e3d8bf;
    --ink:#1E1A16;
    --mustard:#E8A33D;
    --mustard-dark:#b97e28;
    --brick:#B5432D;
    --brick-dark:#8f3220;
    --brass:#C08A2E;
    --line:rgba(242,233,214,0.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,163,61,0.10), transparent 60%),
      radial-gradient(1200px 700px at 110% 10%, rgba(181,67,45,0.10), transparent 55%),
      var(--teal-deep);
    color:var(--cream);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{ width:100%; max-width:760px; }
  .board{
    border:1px solid var(--line);
    border-radius:4px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
    padding:0;
    overflow:hidden;
  }
  .board-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px dashed var(--line);
  }
  .brand{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px;
    letter-spacing:1px;
    color:var(--mustard);
    line-height:1;
  }
  .brand span{color:var(--cream);}
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    letter-spacing:0.06em;
  }
  .panel{ padding:22px; }

  /* ---- Landing / entry ---- */
  .choice-row{ display:flex; gap:14px; margin-top:20px; }
  .choice-card{
    flex:1;
    background:var(--cream);
    color:var(--ink);
    border-radius:4px;
    padding:20px;
    cursor:pointer;
    border:1.5px solid transparent;
    text-align:left;
  }
  .choice-card:hover{ border-color:var(--mustard-dark); }
  .choice-card h3{
    font-family:'Bebas Neue', sans-serif;
    font-size:24px;
    margin:0 0 6px;
    color:var(--teal-deep);
  }
  .choice-card p{ margin:0; font-size:13.5px; color:#5c5344; line-height:1.4; }
  .back-link{
    background:none; border:none; cursor:pointer;
    color:var(--cream-dim); font-size:13px;
    font-family:'IBM Plex Sans', sans-serif;
    padding:0; margin-bottom:14px; text-decoration:underline;
  }
  .back-link:hover{ color:var(--mustard); }

  .stub-row{
    display:flex;
    gap:0;
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .stub-main{
    flex:1.3;
    background:var(--cream);
    color:var(--ink);
    padding:26px 24px;
  }
  .stub-side{
    flex:1;
    background:#0f2e28;
    padding:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-left:2px dashed rgba(242,233,214,0.25);
    gap:10px;
  }
  .stub-side .qr-wrap{
    background:var(--cream);
    padding:10px;
    border-radius:3px;
  }
  .stub-side .qr-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    text-align:center;
  }
  .h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:40px;
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--teal-deep);
  }
  .sub{ margin:0 0 20px; color:#4a4238; font-size:14.5px; line-height:1.5;}
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-family:'IBM Plex Mono', monospace;
    color:#6b6154;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid #cfc3a5;
    background:#fffdf7;
    border-radius:3px;
    font-size:16px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  .field input.code-input{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
  }
  .field input:focus{ outline:2px solid var(--mustard-dark); outline-offset:1px; }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 20px;
    border-radius:3px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--mustard); color:#2b1c05; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ background:#a89469; color:#5c4f34; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    border:1.5px solid rgba(242,233,214,0.35);
    color:var(--cream);
  }
  .btn-ghost:hover{ border-color:var(--mustard); color:var(--mustard);}
  .btn-block{ width:100%; margin-top:14px; }
  .error-line{
    margin-top:10px;
    font-size:13px;
    color:var(--brick);
    font-weight:600;
  }

  /* ---- Lobby ---- */
  .code-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0f2e28;
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:18px;
  }
  .code-banner .code-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    letter-spacing:0.03em;
    color:var(--mustard);
    font-weight:600;
    word-break:break-all;
    max-width:280px;
  }
  .code-banner .code-label{ font-size:11px; color:var(--cream-dim); font-family:'IBM Plex Mono', monospace; }
  .qr-inline{ background:var(--cream); padding:8px; border-radius:3px; }
  .link-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .link-row input{
    flex:1;
    padding:10px 12px;
    border:1.5px solid rgba(242,233,214,0.25);
    background:#0a221d;
    color:var(--cream-dim);
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }
  .link-row .btn{ padding:10px 16px; font-size:13px; white-space:nowrap; }
  .copied-note{ font-size:12px; color:var(--mustard); margin-top:6px; height:14px; }
  .roster{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
  }
  .team-col{
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 14px 16px;
  }
  .team-col.a{ border-top:3px solid var(--mustard); }
  .team-col.b{ border-top:3px solid var(--brick); }
  .team-title{
    font-family:'Bebas Neue', sans-serif;
    font-size:22px;
    letter-spacing:0.5px;
    margin:0 0 8px;
  }
  .team-col.a .team-title{ color:var(--mustard); }
  .team-col.b .team-title{ color:var(--brick); }
  .roster-name{
    font-size:14px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    color:var(--cream-dim);
  }
  .roster-name:last-child{ border-bottom:none; }
  .roster-name.me{ color:var(--cream); font-weight:600; }
  .empty-note{ font-size:13px; color:var(--cream-dim); font-style:italic; }
  .waiting-note{
    margin-top:16px;
    font-size:13.5px;
    color:var(--cream-dim);
    text-align:center;
  }

  /* ---- Track ---- */
  .track-wrap{ margin:6px 0 20px; }
  .track-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .track-label{
    width:64px;
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    flex-shrink:0;
  }
  .track-row.a .track-label{ color:var(--mustard); }
  .track-row.b .track-label{ color:var(--brick); }
  .rail{
    position:relative;
    flex:1;
    height:30px;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 24px, rgba(242,233,214,0.14) 24px, rgba(242,233,214,0.14) 26px);
    border-top:2px solid rgba(242,233,214,0.3);
    border-bottom:2px solid rgba(242,233,214,0.3);
  }
  .rail .finish{
    position:absolute; right:2px; top:-2px; bottom:-2px;
    width:3px; background:var(--cream);
  }
  .rail .train{
    position:absolute; top:50%; transform:translate(-6px,-50%);
    font-size:22px;
    transition:left 1.1s cubic-bezier(.3,.8,.4,1);
  }

  /* ---- Question card ---- */
  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--cream-dim);
  }
  .timer-pill{
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    font-weight:600;
  }
  .qcard{
    background:var(--cream);
    color:var(--ink);
    border-radius:5px;
    overflow:hidden;
  }
  .qimg-wrap{
    width:100%;
    min-height:220px;
    max-height:380px;
    padding:14px;
    background:#0f2e28;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .qimg-wrap img{
    width:auto;
    height:auto;
    max-width:100%;
    max-height:350px;
    object-fit:contain;
    display:block;
  }
  .qimg-fallback{
    color:var(--cream-dim);
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    text-align:center;
    padding:20px;
  }
  .qbody{ padding:20px 22px 22px; }
  .qtext{
    font-size:19px;
    font-weight:600;
    margin:0 0 16px;
    line-height:1.35;
  }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{
    text-align:left;
    padding:13px 14px;
    border:1.5px solid #d9cca8;
    border-radius:4px;
    background:#fffdf7;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
  }
  .opt:hover:not(:disabled){ border-color:var(--mustard-dark); }
  .opt:disabled{ cursor:default; opacity:0.6; }
  .opt.picked{ border-color:var(--mustard-dark); background:#fbeed4; }
  .opt.correct{ border-color:#3f7a4f; background:#e2f0e4; }
  .opt.wrong{ border-color:var(--brick); background:#f6dfd8; }
  .voted-note{
    margin-top:14px;
    font-size:13px;
    color:#6b6154;
    font-style:italic;
  }

  /* ---- Reveal ---- */
  .reveal-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
  }
  .result-col{
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px;
    text-align:center;
  }
  .result-col.a{ border-top:3px solid var(--mustard); }
  .result-col.b{ border-top:3px solid var(--brick); }
  .result-verdict{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    margin:6px 0 2px;
  }
  .result-col.win .result-verdict{ color:#7fbf8f; }
  .result-col.lose .result-verdict{ color:var(--cream-dim); }
  .result-sub{ font-size:12.5px; color:var(--cream-dim); }

  /* ---- Winner ---- */
  .winner-wrap{ text-align:center; padding:20px 0 8px; }
  .winner-flag{ font-size:64px; margin-bottom:6px; }
  .winner-title{
    font-family:'Bebas Neue', sans-serif;
    font-size:44px;
    letter-spacing:0.5px;
  }
  .winner-title.a{ color:var(--mustard); }
  .winner-title.b{ color:var(--brick); }

  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--cream-dim);
    margin-top:18px;
  }
  .host-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:2px 7px;
    border-radius:10px;
    border:1px solid var(--brass);
    color:var(--brass);
    margin-left:8px;
    vertical-align:middle;
  }



  /* ---- Game audio + victory effects ---- */
  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
  }
  .confetti-piece{
    position:absolute;
    top:-14px;
    width:9px;
    height:14px;
    opacity:0;
    animation:confettiFall var(--fall) cubic-bezier(.15,.75,.25,1) forwards;
  }
  @keyframes confettiFall{
    0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:1}
    100%{transform:translate3d(var(--drift),105vh,0) rotate(var(--spin));opacity:0}
  }
  .winner-wrap.victory{
    animation:winnerPop .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes winnerPop{
    0%{transform:scale(.82);opacity:0}
    100%{transform:scale(1);opacity:1}
  }

  /* Mobile / touch improvements */
  button, .choice-card { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { min-height: 44px; }
  .choice-card { min-height: 110px; }
  input, button { font-size: 16px; }
  @media (max-width:560px){
    body{ padding:12px 8px 32px; }
    .board-head{ padding:15px 16px; }
    .brand{ font-size:30px; }
    .panel{ padding:16px; }
    .h1{ font-size:34px; }
    .qbody{ padding:16px; }
    .qtext{ font-size:18px; }
    .opt{ padding:14px; min-height:52px; }
    .link-row{ flex-direction:column; }
    .link-row .btn{ width:100%; }
    .link-row input{ width:100%; }
    .stub-main, .stub-side{ padding:20px 16px; }
    .rail{ min-width:0; }
  }

  @media (max-width:560px){
    .choice-row{ flex-direction:column; }
    .stub-row{ flex-direction:column; }
    .stub-side{ border-left:none; border-top:2px dashed rgba(242,233,214,0.25); }
    .roster, .reveal-summary{ grid-template-columns:1fr; }
    .options{ grid-template-columns:1fr; }
    .code-banner{ flex-direction:column; align-items:flex-start; gap:10px; }
  }


.host-next-wrap{display:flex;justify-content:center;margin-top:16px}
.host-next-btn{min-width:190px;font-weight:900}
.host-only-note{font-size:13px;opacity:.72;text-align:center;margin-top:8px}
\n
.voting-side{
  border:1px solid rgba(242,233,214,.16);
  border-radius:14px;
  padding:16px;
  background:rgba(255,255,255,.035);
  min-width:190px;
}
.voting-side h4{margin:0 0 12px;font-size:15px}
.vote-row{margin:12px 0}
.vote-label{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:5px}
.vote-bar{height:9px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden}
.vote-fill{height:100%;border-radius:999px;transition:width .25s ease}
.vote-fill.a{background:var(--mustard)}
.vote-fill.b{background:var(--brick)}
.vote-total{font-size:12px;opacity:.68;margin-top:10px}
.q-layout-with-votes{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:start}
@media(max-width:760px){.q-layout-with-votes{grid-template-columns:1fr}.voting-side{min-width:0}}

.voting-countdown{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:10px auto;
  padding:7px 14px;
  border-radius:999px;
  font-weight:800;
  font-size:15px;
  background:#173d35;
  color:#fff;
  letter-spacing:.2px;
}
.voting-countdown.urgent{
  animation: votingPulse .7s ease-in-out infinite alternate;
}
@keyframes votingPulse{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

</style>
</head>
<body>
<div class="app">
  <div class="board">
    <div class="board-head">
      <div class="brand">ART <span>RACE</span></div>
      <div class="tag" id="statusTag">DEPARTURES</div>
    </div>
    <div class="panel" id="root">
      <!-- rendered by JS -->
    </div>
  </div>
  <div class="footer-note">Two trains, one gallery. Answer together, move as a team.</div>
</div>

<script>
(function(){
  "use strict";

  const ROUND_MS = 15000;
  const REVEAL_MS = 5000;
  const FINISH_LINE = 6;

  const QUESTIONS = [
    {
      title:"The Starry Night", artist:"Vincent van Gogh",
      img:"https://upload.wikimedia.org/wikipedia/commons/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg",
      options:["Vincent van Gogh","Claude Monet"]
    },
    {
      title:"The Great Wave off Kanagawa", artist:"Katsushika Hokusai",
      img:"https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg",
      options:["Utagawa Hiroshige","Katsushika Hokusai"]
    },
    {
      title:"Mona Lisa", artist:"Leonardo da Vinci",
      img:"https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg",
      options:["Michelangelo","Leonardo da Vinci"]
    },
    {
      title:"Girl with a Pearl Earring", artist:"Johannes Vermeer",
      img:"https://upload.wikimedia.org/wikipedia/commons/0/0f/1665_Girl_with_a_Pearl_Earring.jpg",
      options:["Johannes Vermeer","Rembrandt"]
    },
    {
      title:"The Scream", artist:"Edvard Munch",
      img:"https://upload.wikimedia.org/wikipedia/commons/f/f4/The_Scream.jpg",
      options:["Egon Schiele","Edvard Munch"]
    },
    {
      title:"American Gothic", artist:"Grant Wood",
      img:"https://upload.wikimedia.org/wikipedia/commons/9/91/Grant_Wood_-_American_Gothic_-_Google_Art_Project.jpg",
      options:["Edward Hopper","Grant Wood"]
    },
    {
      title:"A Sunday on La Grande Jatte", artist:"Georges Seurat",
      img:"https://upload.wikimedia.org/wikipedia/commons/2/22/A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg",
      options:["Paul Signac","Georges Seurat"]
    },
    {
      title:"Water Lilies", artist:"Claude Monet",
      img:"https://upload.wikimedia.org/wikipedia/commons/f/fa/Claude_Monet_-_Water_Lilies_-_1919.jpg",
      options:["Claude Monet","Pierre-Auguste Renoir"]
    }
  ];
  // Deterministic shuffle so every browser sees the exact same option order.
  function seededShuffle(arr, seed){
    const out = arr.slice();
    let x = seed >>> 0;
    for(let i=out.length-1;i>0;i--){
      x = (1664525 * x + 1013904223) >>> 0;
      const j = x % (i + 1);
      [out[i],out[j]] = [out[j],out[i]];
    }
    return out;
  }
  const ROUNDS = QUESTIONS.map((q, index)=>{
    const correct = q.options[0];
    const opts = seededShuffle(q.options, 0xA17ACE + index * 7919);
    return { title:q.title, img:q.img, options:opts, answerIndex:opts.indexOf(correct) };
  });

  let myId = null;
  let myName = "";
  let roomCode = null;
  let pollTimer = null;
  let votedRound = -1;
  let entryStep = "landing"; // landing | host | join
  let prefillCode = "";

  // ---------- Game audio / celebration ----------
  // Uses the Web Audio API, so no sound files or external assets are needed.
  let audioCtx = null;
  let lastSoundRound = -1;
  let lastSoundStatus = "";
  let lastCelebratedWinner = null;

  function unlockAudio(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
  }

  function tone(freq, duration, type="sine", volume=0.045, when=0, slideTo=null){
    try{
      unlockAudio();
      if(!audioCtx) return;
      const now = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if(slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }catch(e){}
  }

  function playTick(urgent=false){
    tone(urgent ? 880 : 620, urgent ? 0.09 : 0.055, "square", urgent ? 0.055 : 0.035);
  }

  function playTimeUp(){
    tone(740, 0.12, "square", 0.06, 0);
    tone(520, 0.18, "square", 0.06, 0.13);

  function handleGameSounds(room){

      const remaining = Math.max(0, ROUND_MS - elapsed);
      const second = Math.ceil(remaining / 1000);
      if(second <= 5 && second >= 1 && lastSoundRound !== room.roundIndex){
        lastSoundRound = room.roundIndex;
        playTick(true);
      }
    }

    // Time-up is heard once when the host changes question -> reveal.
    if(room.status === "reveal" && lastSoundStatus !== "reveal"){
      playTimeUp();
      if(room.lastResult && (room.lastResult.aCorrect || room.lastResult.bCorrect)){
        setTimeout(playCorrect, 430);
      }
    }

    // Victory celebration happens once for a winning team.
    if(room.status === "finished" && room.winner !== "TIE" && lastCelebratedWinner !== room.winner){
      lastCelebratedWinner = room.winner;
      playWin();
      setTimeout(launchConfetti, 120);

  // Accepts a raw room code OR a pasted join link and pulls out the code either way.
  function extractCode(input){
    input = (input||"").trim();
    if(!input) return "";

      try{
        const u = new URL(input);
        const fromParam = u.searchParams.get("room");

  // --- Browser-to-browser multiplayer backend ---
  // Uses PeerJS for WebRTC signaling. No API key or database key is required.
  // The host is authoritative: players send joins/votes to the host, and the
  // host broadcasts the current room state to everyone.
  let peer = null;
  let hostPeerId = null;
  let hostConnections = [];
  let localRoom = null;
  let lastStorageError = null;

  function makeRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    const bytes = new Uint32Array(6);
    if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
    else for(let i=0;i<bytes.length;i++) bytes[i] = Math.random()*0xffffffff;
    for(let i=0;i<6;i++) code += chars[bytes[i] % chars.length];
    return code;
  }

  function hostIdForCode(code){
    return "art-race-" + String(code).toUpperCase();
  }

  function closePeer(){
    try{ if(peer) peer.destroy(); }catch(e){}
    peer = null;
    hostConnections = [];
    hostPeerId = null;
  }

  function broadcastRoom(){
    if(!localRoom || localRoom.hostId !== myId) return;
    const payload = { type:"state", room:localRoom };
    hostConnections = hostConnections.filter(c => c && c.open);
    hostConnections.forEach(c => { try{ c.send(payload); }catch(e){} });
  }

  function setupHostPeer(){
    return new Promise((resolve,reject)=>{
      const id = hostIdForCode(roomCode);
      try{
        peer = new Peer(id, {
          debug: 0
        });
      }catch(e){ reject(e); return; }

      const timer = setTimeout(()=>reject(new Error("Lobby creation timed out. Please check your internet connection and try again.")),15000);
      peer.on("open", ()=>{ clearTimeout(timer); resolve(true); });
      peer.on("error", err=>{ clearTimeout(timer);
        lastStorageError = err;
        if(err && err.type === "unavailable-id"){
          reject(new Error("That room code is already in use. Please create the room again."));
        }else if(err && err.message){
          reject(new Error(err.message));
        }else{
          reject(new Error("Peer-to-peer connection could not be created. Check your internet connection."));
        }
      });

      peer.on("connection", conn=>{
        hostConnections.push(conn);
        conn.on("open", ()=>{
          conn.on("data", msg=>{
            if(!msg || typeof msg !== "object") return;

            if(msg.type === "join"){
              if(localRoom.status !== "lobby") return;
              const name = String(msg.name || "").trim().slice(0,24);
              const id = String(msg.id || "");
              if(!name || !id) return;
              if(localRoom.players.some(p=>p.id===id)) return;
              if(localRoom.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
                try{ conn.send({type:"error", reason:"That name is already taken in this room — try another."}); }catch(e){}
                return;
              }
              localRoom.players.push({id, name, team:assignTeam(localRoom.players)});
              try{ conn.send({type:"joined", myId:id}); }catch(e){}
              broadcastRoom();
              render(localRoom);
              return;
            }

            if(msg.type === "vote"){
              if(localRoom.status !== "question") return;
              const player = localRoom.players.find(p=>p.id===msg.playerId);
              if(!player || player.id !== msg.playerId) return;
              const ri = Number(msg.roundIndex);
              const oi = Number(msg.optionIndex);
              if(ri !== localRoom.roundIndex || !Number.isInteger(oi) || oi<0 || oi>=ROUNDS[ri].options.length) return;
              if(!localRoom.votes[ri]) localRoom.votes[ri] = {};
              if(localRoom.votes[ri][player.id] !== undefined) return;
              localRoom.votes[ri][player.id] = oi;
              broadcastRoom();
            }
          });
          conn.on("close", ()=>{ hostConnections = hostConnections.filter(c=>c!==conn); });
          conn.on("error", ()=>{ hostConnections = hostConnections.filter(c=>c!==conn); });
          try{ conn.send({type:"state", room:localRoom}); }catch(e){}
        });
      });
    });
  }

  function setupGuestPeer(){
    return new Promise((resolve,reject)=>{
      try{ peer = new Peer(); }catch(e){ reject(e); return; }
      const timer = setTimeout(()=>{
        reject(new Error("Peer-to-peer connection timed out. Check your internet connection."));
      }, 15000);
      peer.on("open", ()=>{
        clearTimeout(timer);
        resolve(true);
      });
      peer.on("error", err=>{
        lastStorageError = err;
        reject(new Error(err && err.message ? err.message : "Peer-to-peer connection failed."));
      });
    });
  }

  function connectToHost(code){
    return new Promise((resolve,reject)=>{
      const target = hostIdForCode(code);
      let settled = false;
      const conn = peer.connect(target, { reliable:true });

      const timer = setTimeout(()=>{
        if(!settled){
          settled = true;
          reject(new Error("Couldn't reach the host. Make sure the host's browser is open."));
        }
      }, 10000);

      conn.on("open", ()=>{
        if(settled) return;
        clearTimeout(timer);
        conn.send({type:"join", id:myId, name:myName});
        hostConnections = [conn];

        conn.on("data", msg=>{
          if(msg.type === "state" && msg.room){
            localRoom = msg.room;
            render(localRoom);
          }else if(msg.type === "error"){
            if(!settled){ settled=true; reject(new Error(msg.reason || "The host rejected the join.")); }
          }else if(msg.type === "joined"){
            if(!settled){ settled=true; resolve(conn); }
          }
        });
        conn.on("close", ()=>{
          if(myId && localRoom && localRoom.hostId !== myId){
            localRoom = null;
            render(null);
          }
        });
        conn.on("error", ()=>{
          if(!settled){ settled=true; reject(new Error("Connection to the host failed.")); }
        });
      });
      conn.on("error", ()=>{
        if(!settled){
          clearTimeout(timer); settled=true;
          reject(new Error("Couldn't reach the host. Make sure the host's browser is open."));
        }
      });
    });
  }

  async function getRoom(){
    return localRoom;
  }

  async function setRoom(code, obj){
    localRoom = obj;
    if(localRoom.hostId === myId) broadcastRoom();
    return true;
  }


  function assignTeam(players){
    const a = players.filter(p=>p.team==="A").length;
    const b = players.filter(p=>p.team==="B").length;
    return a <= b ? "A" : "B";
  }

  function defaultRoom(hostId){
    return {hostId, players:[], status:"lobby", roundIndex:0,
      questionStartedAt:null, revealedAt:null, votes:{},
      trainA:0, trainB:0, lastResult:null, winner:null};
  }

  async function createRoom(name){
    try{
      closePeer();
      myId = "host-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      myName = name;
      roomCode = makeRoomCode();
      localRoom = defaultRoom(myId);
      localRoom.players = [{id:myId, name:myName, team:"A"}];
      await setupHostPeer();
      render(localRoom);
      return {ok:true};
    }catch(e){
      const reason = e && e.message ? e.message : "Could not create the room.";
      closePeer(); localRoom=null; roomCode=null; myId=null; myName="";
      return {ok:false, reason};
    }
  }

  async function joinRoom(inputCode, name){
    try{
      closePeer();
      const code = extractCode(inputCode).toUpperCase();
      myId = "player-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      myName = name; roomCode = code; localRoom=null;
      await setupGuestPeer();
      await connectToHost(code);
      return {ok:true};
    }catch(e){
      closePeer(); localRoom=null; roomCode=null; myId=null; myName="";
      return {ok:false, reason:e && e.message ? e.message : "Could not join the room."};
    }
  }

  async function castVote(code, roundIndex, optionIndex, playerId){
    if(!localRoom) return false;
    if(localRoom.hostId === myId){
      if(localRoom.status!=="question" || roundIndex!==localRoom.roundIndex) return false;
      if(!localRoom.votes[roundIndex]) localRoom.votes[roundIndex]={};
      if(localRoom.votes[roundIndex][playerId] !== undefined) return false;
      localRoom.votes[roundIndex][playerId]=optionIndex;
      broadcastRoom(); return true;
    }
    const conn=hostConnections[0];
    if(!conn || !conn.open) return false;
    try{ conn.send({type:"vote",playerId,roundIndex,optionIndex}); return true; }
    catch(e){ return false; }
  }

  async function startRace(){
    if(!localRoom || localRoom.hostId!==myId) return false;
    localRoom.roundIndex=0; localRoom.status="question";
    localRoom.questionStartedAt=Date.now(); localRoom.revealedAt=null;
    localRoom.votes={}; localRoom.trainA=0; localRoom.trainB=0;
    localRoom.lastResult=null; localRoom.winner=null; votedRound=-1;
    broadcastRoom(); render(localRoom); return true;
  }

  function majorityAnswer(votesByPlayer, players, team){
    const counts = {};
    players.filter(p=>p.team===team).forEach(p=>{
      const v = votesByPlayer[p.id];
      if(v===undefined || v===null) return;
      counts[v] = (counts[v]||0)+1;
    });
    let best=null, bestCount=-1, tie=false;
    for(const k in counts){
      if(counts[k]>bestCount){ best=k; bestCount=counts[k]; tie=false; }
      else if(counts[k]===bestCount){ tie=true; }
    }
    if(best===null || tie) return null;
    return parseInt(best,10);
  }

  async function hostTallyAndReveal(room){
    if(!room || room.hostId !== myId) return;
    const round = ROUNDS[room.roundIndex];
    const votes = (room.votes && room.votes[room.roundIndex]) || {};
    const aAns = majorityAnswer(votes, room.players, "A");
    const bAns = majorityAnswer(votes, room.players, "B");
    const aCorrect = aAns !== null && aAns === round.answerIndex;
    const bCorrect = bAns !== null && bAns === round.answerIndex;
    if(aCorrect) room.trainA += 1;
    if(bCorrect) room.trainB += 1;
    room.lastResult = { answerIndex:round.answerIndex, aAns, bAns, aCorrect, bCorrect };
    room.status = "reveal";
    room.revealedAt = Date.now();
    broadcastRoom();
  }

  async function hostAdvanceAfterReveal(room){
    if(!room || room.hostId !== myId) return;
    const done = room.trainA >= FINISH_LINE || room.trainB >= FINISH_LINE || room.roundIndex+1 >= ROUNDS.length;
    if(done){
      let winner;
      if(room.trainA===room.trainB) winner="TIE";
      else winner = room.trainA>room.trainB ? "A" : "B";
      room.status="finished";
      room.winner=winner;
      broadcastRoom();
    }else{
      room.roundIndex += 1;
      room.status = "question";
      room.questionStartedAt = Date.now();
      room.revealedAt = null;
      room.lastResult = null;
      room.votes = {};
      broadcastRoom();
    }
  }

  let lastRenderKey = "";

  function renderKey(room){
    if(!room) return "none";
    // Ignore timestamps so the lobby/share-link UI is not rebuilt every 500ms.
    return JSON.stringify({
      myId,
      roomCode,
      hostId: room.hostId,
      status: room.status,
      roundIndex: room.roundIndex,
      players: room.players,
      votes: room.votes,
      trainA: room.trainA,
      trainB: room.trainB,
      lastResult: room.lastResult,
      winner: room.winner
    });
  }

  
async function optimizeQuestionImage(src, maxW=1280, maxH=720, quality=0.82){
  if(!src || !/^data:image\//i.test(src)) return src;
  try{
    const img = new Image();
    img.decoding = "async";
    img.src = src;
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
    });

    const scale = Math.min(1, maxW/img.naturalWidth, maxH/img.naturalHeight);
    if(scale >= 1) return src;

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext("2d", {alpha:false});
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg", quality);
  }catch(e){
    return src;
  }
}

async function optimizeRoomImages(room){
  if(!room || !room.questions) return;
  let changed = false;
  for(const q of room.questions){
    if(q.img && /^data:image\//i.test(q.img)){
      const optimized = await optimizeQuestionImage(q.img);
      if(optimized !== q.img){
        q.img = optimized;
        changed = true;
      }
    }
  }
  return changed;
}


function normalizeQuestionChoices(room){
  if(!room || !Array.isArray(room.questions)) return false;
  let changed = false;
  for(const q of room.questions){
    if(Array.isArray(q.choices) && q.choices.length > 2){
      q.choices = q.choices.slice(0,2);
      if(typeof q.answer === "number" && q.answer > 1) q.answer = 0;
      changed = true;
    }
  }
  return changed;
}

function renderIfChanged(room){
    const key = renderKey(room);
    if(key === lastRenderKey) return;
    lastRenderKey = key;
    render(room);
  }

  async function tick(){
    if(!localRoom) return;
    const room = localRoom;
    const amHost = room.hostId === myId;
    handleGameSounds(room);

    if(amHost && room.status==="question" && room.questionStartedAt){
      if(Date.now() - room.questionStartedAt >= ROUND_MS){
        await hostTallyAndReveal(room);
      }
    }

    if(amHost && room.status==="reveal" && room.revealedAt){
      if(Date.now() - room.revealedAt >= REVEAL_MS){
        await hostAdvanceAfterReveal(room);
      }
    }

    renderIfChanged(room);
  }

  function startPolling(){

    pollTimer = setInterval(tick, 500);

    }

    if(room.status==="question"){ statusTag.textContent=`ROUND ${room.roundIndex+1} / ${ROUNDS.length}`; root.appendChild(renderQuestion(room, me)); return; }
    if(room.status==="reveal"){ statusTag.textContent="RESULTS"; root.appendChild(renderReveal(room, me)); return; }
    if(room.status==="finished"){ statusTag.textContent="ARRIVED"; root.appendChild(renderFinished(room, me)); return; }
  }

  function renderJoinSetup(){

        const result = await joinRoom(code, name);
        if(!result.ok){
          btn.disabled = false; btn.textContent = "Join the race";
          errLine.textContent = result.reason;
          errLine.style.display = "block";
          return;
        }
        startPolling();
      }
      btn.addEventListener("click", doJoin);
      nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter") doJoin(); });
      codeInput.addEventListener("keydown", e=>{ if(e.key==="Enter") nameInput.focus(); });
    },0);
    return wrap;
  }

  function renderLobby(room, me){
    const amHost = room.hostId === myId;
    const teamA = room.players.filter(p=>p.team==="A");
    const teamB = room.players.filter(p=>p.team==="B");
    const rosterHtml = (list)=> list.length
      ? list.map(p=>`<div class="roster-name ${p.id===myId?'me':''}">${escapeHtml(p.name)}${p.id===room.hostId?' <span style=\"opacity:.6\">(host)</span>':''}</div>`).join("")
      : `<div class="empty-note">Waiting for players…</div>`;

    const wrap = el(`
      <div>
        <div class="code-banner">
          <div>
            <div class="code-label">ROOM CODE</div>
            <div class="code-value">${roomCode}</div>
          </div>
          ${amHost ? `<div class="qr-inline" id="lobbyQr"></div>` : ``}
        </div>
        ${amHost ? `
        <div class="link-row">
          <input type="text" id="joinLinkInput" readonly value="${escapeHtml(joinUrl(roomCode))}">
          <button class="btn btn-ghost" id="copyLinkBtn">Copy link</button>
        </div>
        <div class="copied-note" id="copiedNote"></div>
        ` : ``}
        <h1 class="h1" style="color:var(--cream);font-size:30px;">Platform is open ${amHost?'<span class="host-badge">YOU HOST</span>':''}</h1>
        <p class="sub" style="color:var(--cream-dim);">${amHost ? "Send the link or code to laptops, or let phones scan the QR — anyone with either can join. Two teams, one question at a time, majority rules." : "Waiting for the host to start the race."}</p>
        <div class="roster">
          <div class="team-col a"><div class="team-title">Team Mustard</div>${rosterHtml(teamA)}</div>
          <div class="team-col b"><div class="team-title">Team Brick</div>${rosterHtml(teamB)}</div>
        </div>
        ${amHost ? `<button class="btn btn-primary btn-block" id="startBtn" ${room.players.length<2?'disabled':''}>${room.players.length<2?'Need at least 2 players':'Start the race'}</button>`
                 : `<div class="waiting-note">Waiting for the host to start the race…</div>`}
      </div>
    `);
    if(amHost){
      setTimeout(()=>{
        const qrWrap = wrap.querySelector("#lobbyQr");
        if(qrWrap && window.QRCode){
          new QRCode(qrWrap, { text: joinUrl(roomCode), width:96, height:96, colorDark:"#1E1A16", colorLight:"#F2E9D6" });
        }
        const btn = wrap.querySelector("#startBtn");
        if(btn) btn.addEventListener("click", async ()=>{
          btn.disabled = true; btn.textContent="Starting…";
          await startRace();
        });
        const copyBtn = wrap.querySelector("#copyLinkBtn");
        const linkInput = wrap.querySelector("#joinLinkInput");
        const copiedNote = wrap.querySelector("#copiedNote");
        if(copyBtn){
          copyBtn.addEventListener("click", async ()=>{
            const text = linkInput.value;
            try{
              if(navigator.clipboard && navigator.clipboard.writeText){
                await navigator.clipboard.writeText(text);
              }else{
                linkInput.select();
                document.execCommand("copy");
              }
              copiedNote.textContent = "Link copied.";
            }catch(e){
              linkInput.select();
              copiedNote.textContent = "Couldn't auto-copy — link is selected, press Ctrl/Cmd+C.";
            }
            setTimeout(()=>{ copiedNote.textContent=""; }, 3000);
          });
        }
      },0);
    }
    return wrap;
  }

  function trackHtml(room){
    const pct = (n)=> Math.min(100, (n/FINISH_LINE)*100);
    return `
      <div class="track-wrap">
        <div class="track-row a">
          <div class="track-label">🟡 A</div>
          <div class="rail"><div class="finish"></div><div class="train" style="left:${pct(room.trainA)}%">🚂</div></div>
        </div>
        <div class="track-row b">
          <div class="track-label">🔴 B</div>
          <div class="rail"><div class="finish"></div><div class="train" style="left:${pct(room.trainB)}%">🚋</div></div>
        </div>
      </div>
    `;
  }

  function renderQuestion(room, me){
    const round = ROUNDS[room.roundIndex];
    const wrap = el(`<div></div>`);
    wrap.innerHTML = trackHtml(room);
    const remaining = Math.max(0, ROUND_MS - (Date.now() - (room.questionStartedAt||Date.now())));
    const qcard = el(`
      <div class="qcard">
        <div class="qimg-wrap"><img src="${round.img}" alt="${escapeHtml(round.title)}" onerror="this.parentElement.innerHTML='<div class=&quot;qimg-fallback&quot;>${escapeHtml(round.title)}</div>'"></div>
        <div class="qbody">
          <div class="qmeta">
            <span>YOUR TEAM: ${me.team==='A'?'MUSTARD 🟡':'BRICK 🔴'}</span>
            <span class="timer-pill" id="timerPill">${Math.ceil(remaining/1000)}s</span>
          </div>
          <p class="qtext">Who created this work?</p>
          <div class="voting-countdown" data-voting-countdown>Voting: ${Math.ceil(remaining/1000)}s</div>
      <div class="options" id="optionsWrap">
            ${round.options.map((o,i)=>`<button class="opt" data-i="${i}">${escapeHtml(o)}</button>`).join("")}
          </div>
          <div class="voted-note" id="votedNote" style="display:none;">Vote locked in. Waiting on the rest of the platform…</div>
        </div>
      </div>
    `);
    wrap.appendChild(qcard);

    setTimeout(async ()=>{
      const optionsWrap = qcard.querySelector("#optionsWrap");
      const votedNote = qcard.querySelector("#votedNote");
      const alreadyVoted = votedRound === room.roundIndex;
      if(alreadyVoted){
        optionsWrap.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        votedNote.style.display = "block";
      }
      optionsWrap.querySelectorAll(".opt").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          if(votedRound === room.roundIndex) return;
          const i = parseInt(btn.dataset.i,10);
          optionsWrap.querySelectorAll(".opt").forEach(b=>b.disabled=true);
          btn.classList.add("picked");
          votedRound = room.roundIndex;
          votedNote.style.display = "block";
          await castVote(roomCode, room.roundIndex, i, myId);
        });
      });
      const pill = qcard.querySelector("#timerPill");
      const iv = setInterval(()=>{
        if(!pill.isConnected){ clearInterval(iv); return; }
        const rem = Math.max(0, ROUND_MS - (Date.now() - (room.questionStartedAt||Date.now())));
        pill.textContent = Math.ceil(rem/1000)+"s";
        if(rem<=0) clearInterval(iv);
      }, 500);
    }, 0);

    // Live percentage panel (right side).
    const votes = room.players.filter(p=>p.vote !== undefined && p.vote !== null && p.vote !== "");
    const totalVotes = votes.length;
    const aVotes = votes.filter(p=>String(p.vote)==="A").length;
    const bVotes = votes.filter(p=>String(p.vote)==="B").length;
    const aPct = totalVotes ? Math.round(aVotes / totalVotes * 100) : 0;
    const bPct = totalVotes ? 100 - aPct : 0;
    const qLayout = el(`<div class="q-layout-with-votes"></div>`);
    const main = el(`<div></div>`);
    while(wrap.firstChild) main.appendChild(wrap.firstChild);
    qLayout.appendChild(main);
    qLayout.insertAdjacentHTML("beforeend", `
      <aside class="voting-side">
        <h4>Live voting</h4>
        <div class="vote-row">
          <div class="vote-label"><span>Team Mustard</span><span data-vote-a>0%</span></div>
          <div class="vote-bar"><div class="vote-fill a" data-vote-fill-a style="width:0%"></div></div>
        </div>
        <div class="vote-row">
          <div class="vote-label"><span>Team Brick</span><span data-vote-b>0%</span></div>
          <div class="vote-bar"><div class="vote-fill b" data-vote-fill-b style="width:0%"></div></div>
        </div>
        <div class="vote-total" data-vote-total>0 votes</div>
      </aside>
`);
    const side = qLayout.lastElementChild;
    side.querySelector("[data-vote-a]").textContent = aPct + "%";
    side.querySelector("[data-vote-b]").textContent = bPct + "%";
    side.querySelector("[data-vote-fill-a]").style.width = aPct + "%";
    side.querySelector("[data-vote-fill-b]").style.width = bPct + "%";
    side.querySelector("[data-vote-total]").textContent = totalVotes + (totalVotes === 1 ? " vote" : " votes");
    wrap = qLayout;
    return wrap;
  }

  function renderReveal(room, me){
    const round = ROUNDS[room.roundIndex];
    const res = room.lastResult || {};
    const wrap = el(`<div></div>`);
    wrap.innerHTML = trackHtml(room);
    const qcard = el(`
      <div class="qcard">
        <div class="qimg-wrap"><img src="${round.img}" alt="${escapeHtml(round.title)}" onerror="this.parentElement.innerHTML='<div class=&quot;qimg-fallback&quot;>${escapeHtml(round.title)}</div>'"></div>
        <div class="qbody">
          <p class="qtext">${escapeHtml(round.title)} — by ${escapeHtml(round.options[round.answerIndex])}</p>
          <div class="reveal-summary">
            <div class="result-col a ${res.aCorrect?'win':'lose'}">
              <div class="result-sub">TEAM MUSTARD</div>
              <div class="result-verdict">${res.aCorrect ? 'Full steam ahead' : (res.aAns===null||res.aAns===undefined ? 'No majority' : 'Off track')}</div>
              <div class="result-sub">${res.aAns!==null && res.aAns!==undefined ? 'Picked: '+escapeHtml(round.options[res.aAns]) : ''}</div>
            </div>
            <div class="result-col b ${res.bCorrect?'win':'lose'}">
              <div class="result-sub">TEAM BRICK</div>
              <div class="result-verdict">${res.bCorrect ? 'Full steam ahead' : (res.bAns===null||res.bAns===undefined ? 'No majority' : 'Off track')}</div>
              <div class="result-sub">${res.bAns!==null && res.bAns!==undefined ? 'Picked: '+escapeHtml(round.options[res.bAns]) : ''}</div>
            </div>
          </div>
        </div>
      </div>
    `);
    wrap.appendChild(qcard);

    if(room.hostId === myId){
      const nextWrap = el(`
        <div class="host-next-wrap">
          <button class="btn primary host-next-btn" data-host-next>Next Question →</button>
        </div>
      `);
      wrap.appendChild(nextWrap);
    }

    return wrap;
  }

  function renderFinished(room, me){
    const wrap = el(`<div></div>`);
    wrap.innerHTML = trackHtml(room);
    let title, sub, cls;
    if(room.winner==="TIE"){ title="Dead heat"; sub="Both trains crossed together."; cls=""; }
    else{
      const won = room.winner===me.team;
      title = room.winner==="A" ? "Team Mustard wins" : "Team Brick wins";
      sub = won ? "Your platform got there first." : "Better luck on the next line.";
      cls = room.winner==="A" ? "a" : "b";
    }
    const winCard = el(`
      <div class="winner-wrap ${room.winner!=="TIE" ? "victory" : ""}">
        <div class="winner-flag">🏁</div>
        <div class="winner-title ${cls}">${title}</div>
        <p class="sub" style="color:var(--cream-dim);">${sub}</p>
      </div>
    `);
    wrap.appendChild(winCard);
    if(room.hostId===myId){
      const again = el(`<button class="btn btn-ghost btn-block" id="againBtn">Reset for a new race</button>`);
      setTimeout(()=>{
        again.addEventListener("click", async ()=>{
          const fresh = defaultRoom(room.hostId);
          fresh.players = room.players;
          localRoom = fresh;
          broadcastRoom();
          render(localRoom);
        });
      },0);
      wrap.appendChild(again);
    }
    return wrap;
  }

  lastRenderKey = "";
  render(null);
})();
</script>
</body>
</html>
